# ==============================================================================
# Hospital Management System (HMS) - Nginx Production Reverse Proxy Configuration
# ==============================================================================

upstream hms_backend_upstream {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hospital.local www.hospital.local;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Root directory for production React SPA build
    root /var/www/hms/frontend/dist;
    index index.html;

    # Character encoding
    charset utf-8;

    # Defensive Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:5000; object-src 'none';" always;

    # Max upload limit (matches 2MB Express body limit)
    client_max_body_size 10M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. API Reverse Proxy
    location /api/ {
        proxy_pass http://hms_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable proxy buffering for low latency
        proxy_buffering off;
    }

    # 2. Uploaded Documents and Media
    location /uploads/ {
        alias /var/www/hms/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. React Single Page Application (SPA) HTML5 History Mode Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
